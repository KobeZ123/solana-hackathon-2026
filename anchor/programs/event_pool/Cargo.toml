[package]
name = "event_pool"
version = "0.1.0"
description = "Event pool: Solana-verified tickets with attendee payouts"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "event_pool"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.1.2"

[dev-dependencies]
litesvm = "0.16.0"
solana-sdk = "4.0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
